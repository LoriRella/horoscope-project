<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="CSS/styles.css">
<link rel="icon" href="data:,">
</head>
<body>
   <main id="horoscope-app">

	<h1>Horoscope</h1>

	<form id="horoscope-form">

		<label for="zodiac-sign">Choose your zodiac sign:</label>

		<select id="zodiac-sign">
			<option value="Aries">Aries</option>
			<option value="Taurus">Taurus</option>
			<option value="Gemini">Gemini</option>
			<option value="Cancer">Cancer</option>
			<option value="Leo">Leo</option>
			<option value="Virgo">Virgo</option>
			<option value="Libra">Libra</option>
			<option value="Scorpio">Scorpio</option>
			<option value="Sagittarius">Sagittarius</option>
			<option value="Capricorn">Capricorn</option>
			<option value="Aquarius">Aquarius</option>
			<option value="Pisces">Pisces</option>
		</select>

		<button type="submit">Submit</button>

	</form>

	<section id="horoscope-results">

		<img id="sign-icon" alt="">

		<h2 id="sign"></h2>

		<p id="date-range"></p>

		<p id="daily-horoscope"></p>

		<p id="lucky-numbers"></p>

	</section>

</main> 
    <script src="JS/script.js"></script>
</body>
</html>
